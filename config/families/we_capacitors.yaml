  source_categories: [Aluminum Electrolytic Capacitors, Aluminum Polymer Capacitors,
                      Aluminum Hybrid Polymer Capacitors, Capacitors, Polymer Capacitors,
                      Condensadores electroliticos]
  attributes:
    - id: capacitance
      label: Capacidad
      type: number
      dimension: capacitance
      unit: uF
      required: true
      weight: 3
      aliases: [capacidad, capacitance, valor, value, c]
      rule: {kind: numeric_equal, rel_tol: 0.0, alt_rel_tol: 0.1}
    - use: voltage
      required: true
    - use: tolerance
    - use: esr
    - use: ripple_current
    - use: lifetime_hours
    - id: case_size
      label: Formato (D x L)
      type: text
      required: true
      weight: 3
      aliases: [formato, case size, dimensiones, dimensions, tamano, size, medidas,
                diametro, diameter, d x l, carcasa]
      rule: {kind: text_equal, alt_similarity: 0.9}
    - use: mounting
      required: true
    - use: aec_q
    - use: series
    - use: temperature_range
    - use: rohs

- id: film_capacitor

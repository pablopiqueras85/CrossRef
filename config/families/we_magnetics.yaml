# Componentes inductivos y EMC (linea WE-...).
- id: power_inductor
  label: Inductancia de potencia SMD
  aliases: [inductancia de potencia, power inductor, bobina de potencia, storage inductor,
            inductancia smd, shielded power inductor, choque de potencia, we-lqs, we-pd,
            we-mapi, we-xhmi]
  keywords: [inductancia, inductor, bobina, uh, nh, saturacion, dcr, buck, boost]
  source_categories: [Power Magnetics, Shielded Power Inductors, Unshielded Power Inductors,
                      High Current Inductors, High Voltage Power Inductors,
                      Coupled Power Inductors, Power Inductors, SMT Power Inductors]
  attributes:
    - id: inductance
      label: Inductancia
      type: number
      dimension: inductance
      unit: uH
      required: true
      weight: 3
      aliases: [inductancia, inductance, valor, value, l, l nominal, nominal inductance,
                induktivitaet]
      rule: {kind: numeric_equal, rel_tol: 0.0, alt_rel_tol: 0.05}
    - use: tolerance
      required: true
      rule: {kind: at_most, alt_ratio: 1.0}
    - use: rated_current
      required: true
    - use: saturation_current
    - use: dcr
      required: true
    - use: srf
    - id: footprint
      label: Tamano / footprint
      type: text
      required: true
      weight: 3
      aliases: [tamano, size, footprint, dimensiones, dimensions, encapsulado, package,
                case, medidas, abmessungen, l x w x h]
      rule: {kind: text_equal, alt_similarity: 0.9}
    - use: height_max
    - id: windings
      label: Numero de devanados
      type: number
      dimension: ratio
      weight: 2
      aliases: [devanados, windings, bobinados, numero de devanados, acoplado, coupled,
                canales, phases, fases]
      rule: {kind: numeric_equal}
    - id: shielding
      label: Apantallamiento
      type: enum
      weight: 1
      aliases: [apantallado, shielded, apantallamiento, shielding, blindaje, semi-shielded]
      rule: {kind: enum_equal}
      values:
        apantallado: [apantallado, apantallada, shielded, blindado, blindada, geschirmt]
        no apantallado: [no apantallado, no apantallada, unshielded, sin apantallar,
                         sin blindaje, ungeschirmt]
        semiapantallado: [semiapantallado, semiapantallada, semi-shielded, semi shielded]
    - use: temperature_range
    - use: rohs


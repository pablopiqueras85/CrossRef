      aliases: [frecuencia de medida, test frequency, medido a, measured at,
                frecuencia de referencia, at frequency, messfrequenz]
      rule: {kind: numeric_equal, rel_tol: 0.0}
    - id: inductance
      label: Inductancia
      type: number
      dimension: inductance
      unit: uH
      weight: 2
      aliases: [inductancia, inductance, l, l typ]
      rule: {kind: numeric_equal, rel_tol: 0.0, alt_rel_tol: 0.2}
    - use: rated_current
      required: true
    - use: voltage
    - use: dcr
    - id: lines
      label: Numero de lineas
      type: number
      dimension: ratio
      required: true
      weight: 3
      aliases: [lineas, lines, numero de lineas, canales, channels, hilos, vias]
      rule: {kind: numeric_equal}
    - use: package
      required: true
    - use: mounting
    - use: aec_q
    - use: series
    - use: temperature_range
    - use: rohs


    # condicion queda a la vista en 'current_condition'.
    aliases: [corriente nominal, rated current, ir, i r, i_r, ir 2, i r 2, ir2,
              corriente, current, corriente maxima, max current, corriente continua,
              dc current, nennstrom, corriente de trabajo, rated current ir,

# Resistencias (Passive Components > Resistors).
- id: metal_plate_resistor
  label: Resistencia de placa metalica (shunt)
  aliases: [resistencia de placa metalica, metal plate resistor, shunt, resistencia shunt,
            current sense resistor, resistencia de medida de corriente, metal strip,
            resistencia de potencia de bajo valor]
  keywords: [shunt, current sense, placa metalica, metal plate, mohm, medida de corriente]
  source_categories: [Metal Plate Resistors, Resistors, Passive Components]
  attributes:
    - id: resistance
      label: Valor
      type: number
      dimension: resistance
      unit: ohm
      required: true
      weight: 3
      aliases: [valor, value, resistencia, resistance, ohm, ohmios, r, r nominal,
                widerstand]
      rule: {kind: numeric_equal, rel_tol: 0.0, alt_rel_tol: 0.01}
    - use: tolerance
      required: true
    - id: power_rating
      label: Potencia
      type: number
      dimension: power
      unit: W
      required: true
      weight: 3
      aliases: [potencia, power, power rating, potencia nominal, vatios, p max,
                nennleistung]
      rule: {kind: at_least, alt_ratio: 0.9}
    - use: package
      required: true
    - id: tcr
      label: Coeficiente de temperatura (TCR)
      type: number
      dimension: percent
      unit: ppm
      weight: 2
      aliases: [tcr, coeficiente de temperatura, temperature coefficient, ppm/k,
                ppm por grado, temperaturkoeffizient]
      rule: {kind: at_most, alt_ratio: 1.0}
    - use: mounting
    - use: aec_q
    - use: series
    - use: temperature_range
    - use: rohs


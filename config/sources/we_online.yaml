# Catálogo de we-online.com.
#
# El catálogo no tiene una página por referencia: tiene una página por línea de
# producto (serie) con una tabla donde cada fila es una referencia. Se recorre
# en dos niveles:
#
#     categoría  ->  enlaces a las series  ->  tabla de artículos de cada serie
#
# Eso son ~11 peticiones por categoría en lugar de una por referencia.
#
# Cada celda de la tabla trae el dato ya etiquetado:
#   <td data-column="Z @ 100 MHz" data-unit="Ω">
#     <span class="...data--mobile">Impedance @ 100 MHz</span>   <- nombre completo
#     <span data-sort-value="8">8 Ω</span>                        <- valor limpio
#
# ALTERNATIVA MEJOR: la empresa publica una API REST para clientes
# (we-online.com/en/support/collaboration/api) con datos de artículo,
# disponibilidad y hojas de datos. Si se consigue acceso, usar type: api en
# lugar de esto: no se rompe con los rediseños de la web.

id: we_online
type: web_table
base_url: https://www.we-online.com
manufacturer: Würth Elektronik

request:
  user_agent: "CrossRefBot/0.1 (catalogo interno)"
  rate_limit_per_sec: 0.5      # una petición cada 2 s: sin prisa, sin molestar
  timeout: 60
  respect_robots: true
  cache_dir: data/cache_we

series:
  # Los enlaces de serie viven en la rejilla de líneas de producto. Sin acotar
  # el contenedor se cuelan las migas de pan (que apuntan a la categoría padre).
  link_selector: ".wec-grid__item a[href]"
  # En las mismas rejillas hay kits de diseño, bolsas de filtros, manuales y
  # placas de evaluación. No son componentes que se puedan ofrecer como
  # equivalencia, así que se dejan fuera.
  exclude_pattern: '(?i)/(DESIGN_?KIT|EMC_FILTER_BAGS|ABC_OF_|DYEF_|[^/]*_HANDBOOK$|[^/]*EVALUATION[^/]*$|[^/]*EVAL_BOARD[^/]*$)'
  url_pattern: '^/en/components/products/[A-Za-z0-9][A-Za-z0-9_\-]*$'
  title_selector: "h1"

table:
  selector: "table.wecProductTable"
  row_selector: "tr"
  cell_selector: "td[data-column]"
  label_attr: "data-column"
  label_selector: "span.wecProductTableBody__data--mobile"
  unit_attr: "data-unit"
  value_attr: "data-sort-value"
  reference_columns: ["Order Code"]
  datasheet_selector: 'a[href$=".pdf"]'
  # El estado trae detrás el texto del tooltip: se coge solo el estado.
  value_selectors:
    Status: ".wecLifecycle__status-wrapper > span"
  status_column: "Status"
  active_values: ["active"]
  only_active: false           # true para indexar solo lo que está en producción
  ignore_columns:
    - Datasheet
    - Simulation
    - Downloads
    - Availability
    - Design Kit
    - Filter Stick
    - Filter Bag
    - Sample
    - Compare

# Categorías a indexar.
#
#   family:        fuerza la familia para toda la categoría. Se usa solo cuando
#                  la categoría es homogénea. En las que mezclan (EMC Components
#                  lleva ferritas, chokes, varistores y apantallamiento) se omite
#                  y la familia se deduce del nombre de la serie, que es
#                  descriptivo ("WE-CBF SMT EMI Suppression Ferrite Bead").
#   constant_specs: datos que la categoría da por sabidos y no publica como
#                  columna. Nunca pisan a una columna real.
categories:

  # --- Passive Components -------------------------------------------------
  - url: /en/components/products/pbs/emc_components
    category_path: [Passive Components, EMC Components]
    constant_specs:
      Test frequency: 100 MHz

  - url: /en/components/products/pbs/power_magnetics
    category_path: [Passive Components, Power Magnetics]

  - url: /en/components/products/pbs/capacitors
    category_path: [Passive Components, Capacitors]

  - url: /en/components/products/pbs/eiris
    category_path: [Passive Components, Resistors]

  - url: /en/components/products/pbs/frq_frequency_products_fp
    family: crystal_oscillator
    category_path: [Passive Components, Quartz Crystals & Oscillators]

  - url: /en/components/products/pbs/signal_and_communications
    category_path: [Passive Components, Signal & Communications]

  # --- Optoelectrónica ----------------------------------------------------
  - url: /en/components/products/led/leds
    family: led
    category_path: [Optoelectronic Components, LEDs]

  - url: /en/components/products/led/infrared
    family: led
    category_path: [Optoelectronic Components, Infrared]

  - url: /en/components/products/led/ultraviolet
    family: led
    category_path: [Optoelectronic Components, Ultraviolet]

  # --- Conectores y electromecánica ---------------------------------------
  - url: /en/components/products/em/connectors
    category_path: [Electromechanic Components, Connectors]

  - url: /en/components/products/em/redcube_terminals
    category_path: [Electromechanic Components, REDCUBE Terminals]

  # --- Gestión térmica ----------------------------------------------------
  - url: /en/components/products/tm/gap_filling_solutions
    family: thermal_interface
    category_path: [Thermal Management, Gap Filling Solutions]

  - url: /en/components/products/tm/thermal_heat_spreading_solutions
    family: thermal_interface
    category_path: [Thermal Management, Heat Spreading Solutions]

  - url: /en/components/products/tm/thermal_hybrid_solutions
    family: thermal_interface
    category_path: [Thermal Management, Hybrid Solutions]

  # --- Módulos de alimentación --------------------------------------------
  - url: /en/components/products/ac/pm_active
    family: power_module
    category_path: [Active Components, Power Modules]

  # --- Automoción (AEC-Q). Van aparte porque son referencias distintas. ----
  - url: /en/components/products/am/aecq_ferrites_for_pcb_assembly
    family: ferrite_bead
    category_path: [Automotive, Ferrites for PCB Assembly]
    constant_specs:
      Test frequency: 100 MHz
      AEC-Q: "si"

  - url: /en/components/products/am/aecq_ferrites_for_cable_assembly
    family: cable_ferrite
    category_path: [Automotive, Ferrites for Cable Assembly]
    constant_specs:
      AEC-Q: "si"

  - url: /en/components/products/am/aecq_single_coil_power_inductors
    family: power_inductor
    category_path: [Automotive, Single Coil Power Inductors]
    constant_specs:
      AEC-Q: "si"

  - url: /en/components/products/am/we_automotive_common_mode_chokes
    family: common_mode_choke
    category_path: [Automotive, Common Mode Chokes]
    constant_specs:
      AEC-Q: "si"

  - url: /en/components/products/am/we_automotive_rf_inductors
    family: rf_chip_inductor
    category_path: [Automotive, RF Inductors]
    constant_specs:
      AEC-Q: "si"

  - url: /en/components/products/am/filterchokes
    family: common_mode_choke
    category_path: [Automotive, Filter Chokes]
    constant_specs:
      AEC-Q: "si"

  - url: /en/components/products/am/automotive_aecq_group_power_magnetics
    family: transformer
    category_path: [Automotive, Power Transformer]
    constant_specs:
      AEC-Q: "si"

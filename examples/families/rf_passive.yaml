      label: Terminacion
      type: enum
      aliases: [terminacion, termination, tipo de terminacion, union, attachment]
      rule: {kind: enum_equal}
      values:
        crimpar: [crimp, crimpar, a crimpar, crimping]
        soldar: [solder, soldar, a soldar, soldadura]
        atornillar: [screw, atornillar, roscado, clamp]
        press-fit: [press fit, press-fit, a presion]
    - id: cable_for
      label: Cable compatible
      type: text
      aliases: [cable, para cable, cable compatible, cable type, rg]
      rule: {kind: text_equal}
    - use: frequency_range
    - use: vswr
    - use: rohs

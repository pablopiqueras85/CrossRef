# Familias de RF/microondas pasivas.
- id: rf_attenuator
  label: Atenuador fijo
  aliases: [atenuador, atenuadores, atenuador fijo, atenuador coaxial, attenuator,
            fixed attenuator, coaxial attenuator, atenuador de potencia]
  keywords: [atenuador, attenuator, db, atenuacion, attenuation]
  source_categories: [Atenuadores, Attenuators, Atenuadores fijos]
  attributes:
    - use: impedance
      required: true
      assume: 50 ohm
    - id: attenuation
      label: Atenuacion
      type: number
      dimension: decibel
      unit: dB
      required: true
      weight: 3
      aliases: [atenuacion, attenuation, valor de atenuacion, att, db de atenuacion,
                nivel de atenuacion, atten]
      rule: {kind: numeric_equal, abs_tol: 0.0, alt_abs_tol: 0.5}
    - use: frequency_range
      required: true
    - use: power
      required: true
    - use: connector_a
      required: true
    - use: connector_b
    - use: vswr
    - id: accuracy
      label: Precision de la atenuacion
      type: number
      dimension: decibel
      unit: dB
      aliases: [precision, accuracy, tolerancia de atenuacion, atenuacion tolerancia]
      rule: {kind: at_most, alt_abs_tol: 0.2}
    - use: mounting
    - use: temperature_range
    - use: rohs

